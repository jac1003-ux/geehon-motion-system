  <g transform="translate(44 256)"><rect width="306" height="112" rx="8" class="moduleBox"/><rect width="4" height="112" rx="2" fill="#e0b73a"/><text x="24" y="32" class="module">FILE PLAYER</text><text x="24" y="52" class="caption">SAMPLE SOURCE / TIMELINE</text><rect x="68" y="72" width="150" height="8" rx="4" fill="#d8e2dc"/></g>
