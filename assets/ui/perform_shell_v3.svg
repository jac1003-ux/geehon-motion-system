      .module { font-family: "Avenir Next", "Helvetica Neue", sans-serif; font-size: 15px; font-weight: 600; fill: #29473c; }
      .caption { font-family: "Avenir Next", "Helvetica Neue", sans-serif; font-size: 10px; letter-spacing: .7px; fill: #789087; }
      .micro { font-family: "Avenir Next", "Helvetica Neue", sans-serif; font-size: 9px; letter-spacing: .6px; fill: #668077; }
      .panel { fill: #f9fbf8; stroke: #b7c9bf; }
      .moduleBox { fill: #f2f6f2; stroke: #c3d2ca; }
    </style>
  </defs>
  <rect width="1732" height="845" fill="#e8efea"/>
  <g filter="url(#shadow)">
